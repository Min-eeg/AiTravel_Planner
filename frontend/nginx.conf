server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # /api 反代到后端容器（compose 网络内用服务名寻址）
    location /api/ {
        proxy_pass http://backend:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 关键：关闭缓冲。开着的话事件会被 nginx 攒成一次性返回，
        # 前端收不到逐步推送，和 vite.config.ts 里 dev 代理的注释同理
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA 路由：前端路由由 vue-router 接管，找不到文件回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
