name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端单元测试
    runs-on: ubuntu-latest

    # 不配任何 API Key：单测全部用 Fake 替身，不连高德、不调大模型。
    # 好处是 CI 不依赖外部服务，几分钟内跑完，也不会有偶发连接失败。

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      # .env 含密钥被 gitignore 排除，CI 上不存在。所有配置项都有默认值，
      # MCP_ENABLED 缺省为 1，但单测用注入的 Fake 客户端，不会真正拉起子进程。
      - name: 静态检查（未使用导入 / 未定义名）
        run: python -m pyflakes app eval tests

      - name: 单元测试（不依赖外部服务）
        run: python -m pytest tests -v

  frontend-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci

      # 构建失败通常意味着缺失导入或类型错误，等于免费的静态检查
      - name: 构建校验
        run: npm run build
